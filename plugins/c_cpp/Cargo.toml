[package]
name = "syncore_c_cpp_plugin"
version = "0.1.0"
edition = "2021"
description = "C/C++ plugin for SynCode with tree-sitter indexing and clangd diagnostics"

[dependencies]
# Tree-sitter for parsing
tree-sitter = "0.20"
tree-sitter-c = "0.20"
tree-sitter-cpp = "0.20"

# JSON handling for DLR protocol
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async and runtime
tokio = { version = "1.0", features = ["full"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# LSP client
tokio-tungstenite = "0.20"
url = "2.0"
futures-util = "0.3"
tempfile = "3.0"

# YAML parsing for clang-tidy output
serde_yaml = "0.9"

# File system operations
glob = "0.3"
walkdir = "2.0"

# Utility
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.0"
pretty_assertions = "1.0"

[[bin]]
name = "syncore_c_cpp_plugin"
path = "src/main.rs"
