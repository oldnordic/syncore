[package]
name = "syncore_ts_js_plugin"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "syncore_ts_js_plugin"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tree-sitter = "0.20"
tree-sitter-typescript = "0.20"
tree-sitter-javascript = "0.20"
walkdir = "2.5"
anyhow = "1.0"
regex = "1.10"
tempfile = "3.0"
tokio = { version = "1.0", features = ["full"] }
async-process = "1.8"
futures = "0.3"

[build-dependencies]
tree-sitter-cli = "0.20"