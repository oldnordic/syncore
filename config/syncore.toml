# SynCore Configuration File
# SPEC: SYNCORE-CONFIG-AND-TOOLS-FIX-01 (APEX v1.2)

[paths]
db_path = "/home/feanor/Projects/SynCore/syncore.db"
code_graph_db = "/home/feanor/Projects/SynCore/syncore_code_graph.db"
vector_index_path = "/home/feanor/Projects/SynCore/vector.index"
cache_path = "/home/feanor/Projects/SynCore/cache"
socket_path = "/tmp/syncore.sock"
logs_dir = "/home/feanor/Projects/SynCore/logs"

[neo4j]
uri = "bolt://127.0.0.1:7687"
user = "neo4j"
password = ""  # Override with NEO4J_PASS environment variable
enabled = true

[indexing]
# Directories to exclude from code indexing
excluded_dirs = [
    # Rust
    "target",
    # JavaScript/Node.js
    "node_modules",
    # Version control
    ".git",
    # Python
    "__pycache__",
    ".venv",
    "venv",
    ".tox",
    ".eggs",
    # Go
    "vendor",
    # Java/JVM
    ".gradle",
    ".m2",
    # IDE/Editor
    ".vscode",
    ".idea",
    ".vs",
    # Generic build output
    "dist",
    "build",
    "out",
    # Coverage/Test output
    "coverage",
    "htmlcov",
    ".nyc_output",
    # C/C++
    "cmake-build-debug",
    "cmake-build-release",
    # Cargo registry
    ".cargo",
]

# File extensions to include in indexing
include_extensions = [
    "rs", "py", "js", "ts", "tsx", "jsx",
    "go", "java", "c", "cpp", "h", "hpp",
]

# Maximum file size to index (bytes)
max_file_size = 1048576  # 1MB

[embeddings]
model = "semantic"
dimensions = 384
batch_size = 32

[vector_search]
default_limit = 10
min_score_threshold = 0.3

[project_analysis]
use_indexing_excludes = true

[project_analysis.hotspot_weights]
fan_in = 0.4
fan_out = 0.3
entity_count = 0.2
loc = 0.1

[http]
port = 8080
metrics_port = 9090

[llm]
# Language model backend: "ollama" for production, "test" for testing
backend = "ollama"

# Model name to use - Recommended models (best to worst):
# - "qwen2.5-coder:3b" (BEST - 3B params, 1.9GB, excellent for code)
# - "qwen2.5:0.5b-instruct" (FAST - 397MB, good for simple tasks)
# - "llama3.2" (FALLBACK - use if qwen models unavailable)
model = "qwen2.5-coder:3b"

# Endpoint URL (Ollama CLI connects to local daemon by default)
# Note: We use Ollama CLI (subprocess) not HTTP API for better reliability
# HTTP API has ~60% success rate, CLI has 99%+ success rate
url = "http://localhost:11434"

# Request timeout in seconds
timeout_seconds = 30
