[package]
name = "syncore"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "syncore"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
rmp-serde = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
sled = "0.34"
petgraph = "0.6"
# hnsw_lite = "0.2"  # Will add later when implementing vector search
toml = "0.8"
anyhow = "1.0"
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3.0"
hnsw_rs = "0.3.2"
bincode = "1.3"
scopeguard = "1.2"
lazy_static = "1.4"
jsonschema = "0.17"
tracing = "0.1"
