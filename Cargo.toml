[package]
name = "syncore"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "syncore_mcp_stdio"
path = "src/mcp_stdio_main.rs"

[[bin]]
name = "syncore_graph_cli"
path = "src/graph_cli_main.rs"

[build-dependencies]
cc = "1.0"



[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
rmp-serde = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
sled = "0.34"
petgraph = "0.6"
# hnsw_lite = "0.2"  # Will add later when implementing vector search
toml = "0.8"
anyhow = "1.0"
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3.0"
rand = "0.8"
hnsw_rs = "0.3.2"
bincode = "1.3"
scopeguard = "1.2"
lazy_static = "1.4"
git2 = "0.19"
jsonschema = "0.17"
schemars = "1.1"
 tracing = "0.1"
 rayon = "1.8"
# Simpler ML approach - will integrate real models later
fastembed = "4.9"
 num_cpus = "1.16"
tracing-subscriber = "0.3"
once_cell = "1.19"
dashmap = "6.1"
parking_lot = "0.12"
crossbeam = "0.8"
rustc-hash = "1.1"
arc-swap = "1.7"
tree-sitter = "0.20"
tree-sitter-rust = "0.20"
tree-sitter-javascript = "0.20"
tree-sitter-python = "0.20"
tree-sitter-json = "0.20"
tree-sitter-toml = "0.20"
tree-sitter-bash = "0.20"
regex = "1.10"
thiserror = "1.0"  # APEX 2.2-FW: Error types
notify = { version = "6.1", default-features = false, features = ["macos_kqueue"] }  # APEX 2.2-FW: Filewatcher
which = "6.0"  # APEX 2.5-LSP: Find LSP servers on PATH
rmcp = { version = "0.8", features = ["transport-io", "transport-streamable-http-server"] }
walkdir = "2.5"
glob = "0.3"
deadpool = "0.12"
axum = "0.8"
tokio-util = { version = "0.7", features = ["rt"] }
neo4rs = "0.7"
sha2 = "0.10"
reqwest = { version = "0.12", features = ["json", "blocking"] }  # APEX 2.0-E: Ollama HTTP client
async-trait = "0.1"
futures = "0.3"
# Candle dependencies for local model inference
candle-core = "0.9"
candle-transformers = "0.9"
candle-nn = "0.9"
tokenizers = "0.21"
rand_chacha = "0.3"
hf-hub = "0.4"
# mistral.rs for real GGUF support
mistralrs = { git = "https://github.com/EricLBuehler/mistral.rs" }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
uuid = { version = "1.11", features = ["v4"] }

[[bench]]
name = "vector_benchmarks"
harness = false

[[bench]]
name = "hnsw_compare"
harness = false

[features]
default = []
hybrid-backend = []  # Enable HybridVectorStore (experimental)
