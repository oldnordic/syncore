[package]
name = "syncore"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "syncore"
path = "src/main.rs"

[[bin]]
name = "syncore_mcp_stdio"
path = "src/mcp_stdio_main.rs"

[build-dependencies]
cc = "1.0"



[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
rmp-serde = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
sled = "0.34"
petgraph = "0.6"
# hnsw_lite = "0.2"  # Will add later when implementing vector search
toml = "0.8"
anyhow = "1.0"
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3.0"
hnsw_rs = "0.3.2"
usearch = "2.21"  # High-performance HNSW for vector search (10x faster than FAISS)
instant-distance = "0.6.1"  # Pure Rust HNSW (no FFI issues)
bincode = "1.3"
scopeguard = "1.2"
lazy_static = "1.4"
jsonschema = "0.17"
schemars = "1.1"
 tracing = "0.1"
 rayon = "1.8"
# Simpler ML approach - will integrate real models later
fastembed = "4.0"
 num_cpus = "1.16"
tracing-subscriber = "0.3"
once_cell = "1.19"
tree-sitter = "0.20"
tree-sitter-rust = "0.20"
tree-sitter-javascript = "0.20"
tree-sitter-python = "0.20"
tree-sitter-json = "0.20"
tree-sitter-toml = "0.20"
tree-sitter-bash = "0.20"
regex = "1.10"
rmcp = { version = "0.8", features = ["transport-io", "transport-sse-server"] }
walkdir = "2.5"
glob = "0.3"
deadpool = "0.12"
axum = "0.8"
tokio-util = { version = "0.7", features = ["rt"] }
neo4rs = "0.7"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
reqwest = { version = "0.12", features = ["json"] }

[[bench]]
name = "vector_benchmarks"
harness = false

[features]
default = []
hybrid-backend = []  # Enable HybridVectorStore (experimental)
