name: SynCore CI

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: "1.91.0"
        components: rustfmt, clippy
        
    - name: Verify toolchain version
      run: |
        rustc --version
        cargo --version
        echo "Cargo.lock hash:"
        sha256sum Cargo.lock || echo "No Cargo.lock found"
        
    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
          
    - name: Check code formatting
      run: cargo fmt --all -- --check || true
      
    - name: Clear cargo caches if needed
      run: |
        if [ -d "target" ]; then
          echo "Clearing target directory to ensure clean build"
          rm -rf target
        fi
        
    - name: Run clippy (warnings allowed)
      run: cargo clippy --all-targets --all-features -- -W clippy::all
      
    - name: Run tests
      run: cargo test --all -- -j $(nproc)
      
    - name: Build release binary
      run: cargo build --release -- -j $(nproc)